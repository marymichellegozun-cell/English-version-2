<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Grammar Test</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  margin: 0;
  padding: 20px;
  color: #172033;
}

.container {
  max-width: 700px;
  margin: auto;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 18px;
}

h1 {
  margin-top: 0;
}

textarea {
  width: 100%;
  min-height: 140px;
  box-sizing: border-box;
  padding: 16px;
  font-size: 18px;
  border: 1px solid #ccd2df;
  border-radius: 14px;
}

button {
  margin-top: 14px;
  padding: 15px 20px;
  font-size: 17px;
  border: 0;
  border-radius: 12px;
  background: #4f5df5;
  color: white;
  font-weight: bold;
}

.secondary {
  background: #e9ebff;
  color: #3542c5;
  margin-left: 5px;
}

#status {
  margin-top: 15px;
  font-weight: bold;
}

.result {
  margin-top: 18px;
  padding: 18px;
  background: #f7f8fc;
  border-radius: 14px;
  display: none;
}

.correction {
  font-size: 19px;
  font-weight: bold;
  line-height: 1.5;
}

.issue {
  background: white;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
  border: 1px solid #e0e3eb;
}

.wrong {
  color: #b42318;
  font-weight: bold;
}

.right {
  color: #067647;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Online Grammar Coach</h1>

<p>
Type any English sentence. This test uses an online grammar service instead of our manual rules.
</p>

<textarea id="text">She don't know why the payments is still pending because nobody have explain the reason to her.</textarea>

<button type="button" id="checkBtn">
Check My Grammar
</button>

<button type="button" class="secondary" id="exampleBtn">
Try Another Example
</button>

<div id="status"></div>

<div id="result" class="result">

<h3>Suggested Correction</h3>
<div id="corrected" class="correction"></div>

<h3>What is wrong?</h3>
<div id="issues"></div>

</div>

</div>
</div>

<script>

const textBox = document.getElementById("text");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const correctedBox = document.getElementById("corrected");
const issuesBox = document.getElementById("issues");

document.getElementById("checkBtn").onclick = checkGrammar;

document.getElementById("exampleBtn").onclick = function () {
  textBox.value =
    "He didn't submitted the report because the payments is not yet approved.";
};

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function checkGrammar() {

  const text = textBox.value.trim();

  if (!text) {
    statusBox.textContent = "Please type a sentence.";
    resultBox.style.display = "none";
    return;
  }

  statusBox.textContent = "Checking online...";
  resultBox.style.display = "none";

  try {

    const body = new URLSearchParams();
    body.append("text", text);
    body.append("language", "en-US");

    const response = await fetch(
      "https://api.languagetool.org/v2/check",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body: body.toString()
      }
    );

    if (!response.ok) {
      throw new Error("Service error");
    }

    const data = await response.json();

    const matches = data.matches || [];

    if (matches.length === 0) {
      statusBox.textContent =
        "No grammar issue was detected.";

      correctedBox.textContent = text;
      issuesBox.innerHTML =
        "<div class='issue'>The online checker did not find an error.</div>";

      resultBox.style.display = "block";
      return;
    }

    let corrected = text;

    const usable = matches
      .filter(m => m.replacements && m.replacements.length)
      .sort((a, b) => b.offset - a.offset);

    usable.forEach(match => {

      const replacement =
        match.replacements[0].value;

      corrected =
        corrected.slice(0, match.offset) +
        replacement +
        corrected.slice(
          match.offset + match.length
        );

    });

    correctedBox.textContent = corrected;

    issuesBox.innerHTML = "";

    matches.forEach(match => {

      const wrongText =
        text.slice(
          match.offset,
          match.offset + match.length
        );

      const suggestions =
        (match.replacements || [])
        .slice(0, 4)
        .map(r => r.value);

      const div =
        document.createElement("div");

      div.className = "issue";

      let html =
        "<div><span class='wrong'>Problem:</span> " +
        escapeHTML(wrongText || "Sentence structure") +
        "</div>";

      html +=
        "<div style='margin-top:7px'><strong>Explanation:</strong> " +
        escapeHTML(match.message || "Possible grammar issue.") +
        "</div>";

      if (suggestions.length) {

        html +=
          "<div style='margin-top:7px'><span class='right'>Suggested:</span> " +
          suggestions
            .map(escapeHTML)
            .join(", ") +
          "</div>";
      }

      div.innerHTML = html;

      issuesBox.appendChild(div);

    });

    statusBox.textContent =
      matches.length +
      " possible issue(s) found.";

    resultBox.style.display = "block";

  } catch (error) {

    statusBox.textContent =
      "The online grammar service could not be reached. Do not change the Mega app yet.";

    resultBox.style.display = "none";
  }
}

</script>

</body>
</html>
