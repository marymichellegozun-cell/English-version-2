<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Strong Grammar Coach</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f7f8fc;
color:#1f2937;
}
.app{
max-width:760px;
margin:auto;
padding:22px 16px 80px;
}
h1{font-size:28px;margin-bottom:6px}
.subtitle{color:#6b7280;line-height:1.5}
.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:20px;
padding:18px;
margin-top:16px;
}
textarea{
width:100%;
min-height:150px;
font-size:17px;
padding:14px;
border:1px solid #d1d5db;
border-radius:15px;
resize:vertical;
}
button{
border:0;
border-radius:14px;
padding:13px 16px;
font-weight:700;
font-size:15px;
margin:6px 4px 2px 0;
}
.primary{background:#4f46e5;color:#fff}
.secondary{background:#eef2ff;color:#4f46e5}
.ghost{background:#fff;border:1px solid #d1d5db}
.result{
margin-top:15px;
background:#f3f4f6;
padding:15px;
border-radius:15px;
line-height:1.65;
}
.good{background:#dcfce7}
.warning{background:#fef3c7}
.error{background:#fee2e2}
.small{font-size:13px;color:#6b7280;line-height:1.5}
.issue{
background:#fff;
border:1px solid #e5e7eb;
border-radius:13px;
padding:12px;
margin:9px 0;
}
.corrected{
font-size:18px;
font-weight:700;
}
</style>
</head>

<body>

<div class="app">

<h1>Strong Grammar Coach</h1>

<div class="subtitle">
Everyday English • Work English • Grammar • Spelling • Punctuation
</div>

<div class="card">

<h2>Write your sentence</h2>

<textarea id="inputText"
placeholder="Example: Small problems can prevent, if you escalate immediately"></textarea>

<button class="primary" onclick="checkOnline()">
Check Grammar Online
</button>

<button class="secondary" onclick="checkOffline()">
Quick Offline Check
</button>

<button class="ghost" onclick="tryExample()">
Try Example
</button>

<button class="ghost" onclick="clearAll()">
Clear
</button>

<div id="status" class="small" style="margin-top:10px"></div>

<div id="result" class="result" style="display:none"></div>

</div>


<div class="card">

<h2>Practice examples</h2>

<button class="secondary" onclick="setExample(0)">
Everyday
</button>

<button class="secondary" onclick="setExample(1)">
Work
</button>

<button class="secondary" onclick="setExample(2)">
Accounting
</button>

<button class="secondary" onclick="setExample(3)">
Tense
</button>

<button class="secondary" onclick="setExample(4)">
Professional
</button>

</div>

</div>


<script>

const examples=[

"I am agree with you because this option is more better.",

"Yesterday I go to office and discussed about the delayed payment.",

"The expenses is higher than collections and cash inflows is not enough to outflows.",

"She don't submitted the report yesterday because she didn't knew the deadline.",

"As per checking, management have not yet approve the request and we need to discussed this immediately."

];


function setExample(i){

document.getElementById("inputText").value=examples[i];

document.getElementById("result").style.display="none";

}


function tryExample(){

document.getElementById("inputText").value=
"Small problems can prevent, if you escalate immediately";

checkOnline();

}


function clearAll(){

document.getElementById("inputText").value="";

document.getElementById("result").style.display="none";

document.getElementById("status").textContent="";

}


function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


/* =================================
   OFFLINE GRAMMAR RULES
================================= */

function offlineGrammar(original){

let text=original.trim();

let notes=[];


function fix(regex,replacement,message){

const before=text;

text=text.replace(regex,replacement);

if(text!==before){

notes.push(message);

}

}


/* agreement */

fix(
/\bi am agree\b/gi,
"I agree",
'Use "I agree," not "I am agree."'
);

fix(
/\bshe don't\b/gi,
"she doesn't",
'Use "doesn\\'t" with she.'
);

fix(
/\bhe don't\b/gi,
"he doesn't",
'Use "doesn\\'t" with he.'
);

fix(
/bit don't\b/gi,
"it doesn't",
'Use "doesn\\'t" with it.'
);

fix(
/\bexpenses is\b/gi,
"expenses are",
'Expenses is plural, so use "are."'
);

fix(
/\bcollections is\b/gi,
"collections are",
'Collections is plural, so use "are."'
);

fix(
/bcash inflows is\b/gi,
"cash inflows are",
'Cash inflows is plural, so use "are."'
);

fix(
/bpayments is\b/gi,
"payments are",
'Payments is plural, so use "are."'
);

fix(
/bmanagement have\b/gi,
"management has",
'In this sentence, use "management has."'
);


/* verb form */

fix(
/bdoesn't knows\b/gi,
"doesn't know",
'Use the base verb after "doesn\\'t."'
);

fix(
/bdoesn't has\b/gi,
"doesn't have",
'Use "have" after "doesn\\'t."'
);

fix(
/bdidn't went\b/gi,
"didn't go",
'Use the base verb after "didn\\'t."'
);

fix(
/bdidn't knew\b/gi,
"didn't know",
'Use the base verb after "didn\\'t."'
);

fix(
/bdidn't submitted\b/gi,
"didn't submit",
'Use the base verb after "didn\\'t."'
);

fix(
/bdidn't received\b/gi,
"didn't receive",
'Use the base verb after "didn\\'t."'
);

fix(
/bneed to discussed\b/gi,
"need to discuss",
'Use the base verb after "to."'
);

fix(
/bneed to submitted\b/gi,
"need to submit",
'Use the base verb after "to."'
);

fix(
/bneed to reviewed\b/gi,
"need to review",
'Use the base verb after "to."'
);

fix(
/bcan able to\b/gi,
"can",
'Use "can" or "be able to," not both.'
);


/* tense */

fix(
/byesterday i go\b/gi,
"Yesterday I went",
'Use past tense with "yesterday."'
);

fix(
/byesterday we go\b/gi,
"Yesterday we went",
'Use past tense with "yesterday."'
);

fix(
/byesterday she go\b/gi,
"Yesterday she went",
'Use past tense with "yesterday."'
);

fix(
/blast week i go\b/gi,
"Last week I went",
'Use past tense with "last week."'
);

fix(
/bi have went\b/gi,
"I have gone",
'Use "gone" after "have."'
);

fix(
/bi have saw\b/gi,
"I have seen",
'Use "seen" after "have."'
);

fix(
/bi have did\b/gi,
"I have done",
'Use "done" after "have."'
);


/* unnecessary words */

fix(
/bdiscuss about\b/gi,
"discuss",
'"Discuss" does not need "about."'
);

fix(
/bdiscussed about\b/gi,
"discussed",
'"Discuss" does not need "about."'
);

fix(
/bregarding about\b/gi,
"regarding",
'"Regarding" does not need "about."'
);

fix(
/breturn back\b/gi,
"return",
'"Return" already means go back.'
);

fix(
/brevert back\b/gi,
"reply",
'Use "reply" instead of "revert back" in natural English.'
);

fix(
/bkindly please\b/gi,
"please",
'Use either "kindly" or "please."'
);

fix(
/bmore better\b/gi,
"better",
'"Better" is already comparative.'
);

fix(
/bmore higher\b/gi,
"higher",
'"Higher" is already comparative.'
);

fix(
/bmore easier\b/gi,
"easier",
'"Easier" is already comparative.'
);

fix(
/bmore faster\b/gi,
"faster",
'"Faster" is already comparative.'
);


/* prepositions / business phrasing */

fix(
/bcope up with\b/gi,
"cope with",
'The standard expression is "cope with."'
);

fix(
/bbase on\b/gi,
"based on",
'Use "based on."'
);

fix(
/bas per checking\b/gi,
"upon checking",
'Use "upon checking" for more natural business English.'
);

fix(
/bfor checking\b/gi,
"for review",
'Use "for review" when asking someone to review something.'
);

fix(
/bdespite of\b/gi,
"despite",
'Use "despite" or "in spite of."'
);

fix(
/bexplain me\b/gi,
"explain to me",
'Use "explain to me."'
);

fix(
/bgo to office\b/gi,
"go to the office",
'Use "the office."'
);

fix(
/bwent to office\b/gi,
"went to the office",
'Use "the office."'
);


/* uncountable nouns */

fix(
/binformations\b/gi,
"information",
'"Information" is uncountable.'
);

fix(
/badvices\b/gi,
"advice",
'"Advice" is uncountable.'
);

fix(
/bfurnitures\b/gi,
"furniture",
'"Furniture" is uncountable.'
);


/* workplace specific */

fix(
/bcash inflows are not enough to outflows\b/gi,
"cash inflows are not enough to cover the outflows",
'Use "enough to cover the outflows."'
);

fix(
/bcash inflows is not enough to outflows\b/gi,
"cash inflows are not enough to cover the outflows",
'Use "cash inflows are not enough to cover the outflows."'
);

fix(
/bmanagement has not yet approve\b/gi,
"management has not yet approved",
'After "has," use the past participle "approved."'
);

fix(
/bmanagement have not yet approve\b/gi,
"management has not yet approved",
'Use "management has not yet approved."'
);

fix(
/breport already submit\b/gi,
"report has already been submitted",
'Use the passive form "has already been submitted."'
);

fix(
/bpayment already process\b/gi,
"payment has already been processed",
'Use "has already been processed."'
);

fix(
/bpayment are pending\b/gi,
"payment is pending",
'"Payment" is singular, so use "is."'
);

fix(
/bpayments is pending\b/gi,
"payments are pending",
'"Payments" is plural, so use "are."'
);


/* special pattern from your example */

fix(
/bsmall problems can prevent,\s*if you escalate immediately\b/gi,
"Small problems can be prevented if you escalate them immediately",
'Use passive voice: "can be prevented." Also add "them" after "escalate."'
);

fix(
/bsmall problems can prevent if you escalate immediately\b/gi,
"Small problems can be prevented if you escalate them immediately",
'Use passive voice: "can be prevented." Also add "them" after "escalate."'
);


/* punctuation */

text=text
.replace(/\s+([,.!?])/g,"$1")
.replace(/,\s+if\b/gi," if")
.replace(/\s{2,}/g," ")
.trim();


if(text){

text=
text.charAt(0).toUpperCase()+
text.slice(1);

}


if(
text &&
!/[.!?]$/.test(text)
){

text+=".";

}


return{

corrected:text,

notes:notes

};

}


/* =================================
   OFFLINE BUTTON
================================= */

function checkOffline(){

const input=
document
.getElementById("inputText")
.value
.trim();

const result=
document.getElementById("result");


if(!input){

result.style.display="block";

result.className="result warning";

result.textContent=
"Please type a sentence first.";

return;

}


const checked=
offlineGrammar(input);


result.style.display="block";

result.className=
checked.notes.length
?
"result"
:
"result warning";


let html=

'<div class="corrected">Suggested correction:</div>'+
'<div style="margin-top:8px">'+
escapeHTML(checked.corrected)+
'</div>';


if(checked.notes.length){

html+=
"<br><b>Why:</b><br>"+
checked.notes
.map(note=>"• "+escapeHTML(note))
.join("<br>");

}else{

html+=
"<br><br>No matching offline rule was found. Try the online grammar check for a deeper review.";

}


result.innerHTML=html;

}


/* =================================
   APPLY LANGUAGE TOOL CORRECTIONS
================================= */

function applyMatches(text,matches){

let corrected=text;

const sorted=
[...matches].sort(
(a,b)=>b.offset-a.offset
);


sorted.forEach(match=>{

if(
match.replacements &&
match.replacements.length
){

const replacement=
match.replacements[0].value;

corrected=
corrected.slice(0,match.offset)+
replacement+
corrected.slice(
match.offset+
match.length
);

}

});


return corrected;

}


/* =================================
   ONLINE LANGUAGE TOOL CHECK
================================= */

async function checkOnline(){

const input=
document
.getElementById("inputText")
.value
.trim();

const result=
document.getElementById("result");

const status=
document.getElementById("status");


if(!input){

result.style.display="block";

result.className="result warning";

result.textContent=
"Please type a sentence first.";

return;

}


status.textContent=
"Checking grammar online...";


result.style.display="none";


try{

const params=
new URLSearchParams();

params.append(
"text",
input
);

params.append(
"language",
"en-US"
);


const response=
await fetch(
"https://api.languagetool.org/v2/check",
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:params.toString()
}
);


if(!response.ok){

throw new Error(
"Online grammar service unavailable"
);

}


const data=
await response.json();


let corrected=
applyMatches(
input,
data.matches||[]
);


/*
Also apply our own useful workplace
rules after LanguageTool.
*/

const local=
offlineGrammar(corrected);

corrected=
local.corrected;


const matches=
data.matches||[];


result.style.display="block";


if(
matches.length===0 &&
local.notes.length===0
){

result.className=
"result good";

result.innerHTML=

"<b>No obvious errors found.</b>"+
"<br><br>"+
escapeHTML(corrected);

status.textContent=
"Online grammar check completed.";

return;

}


result.className="result";


let html=

'<div class="corrected">Suggested correction:</div>'+
'<div style="margin-top:8px">'+
escapeHTML(corrected)+
'</div>';


if(matches.length){

html+=
"<br><br><b>Grammar suggestions:</b>";


matches
.slice(0,12)
.forEach(match=>{

const suggestion=
match.replacements &&
match.replacements.length
?
match.replacements
.slice(0,3)
.map(x=>x.value)
.join(", ")
:
"No replacement suggested";


html+=

'<div class="issue">'+

"<b>"+
escapeHTML(
match.message||
"Grammar suggestion"
)+
"</b>"+

"<br>"+

'<span class="small">'+
"Suggestion: "+
escapeHTML(suggestion)+
"</span>"+

"</div>";

});

}


if(local.notes.length){

html+=
"<br><b>Extra English coaching:</b><br>"+
local.notes
.map(note=>"• "+escapeHTML(note))
.join("<br>");

}


result.innerHTML=html;


status.textContent=
"Online grammar check completed.";


}catch(error){

status.textContent=
"Online check could not connect. Showing the offline correction instead.";

checkOffline();

}

}

</script>

</body>
</html>
